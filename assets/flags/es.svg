<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="60" height="40">
  <rect width="750" height="500" fill="#AA151B"/>
  <rect width="750" height="250" y="125" fill="#F1BF00"/>
  <!-- Simplified Coat of Arms Shield -->
  <g transform="translate(180, 175)">
    <!-- Crown -->
    <path d="M 15 15 L 25 35 L 45 20 L 65 35 L 75 15 L 80 40 L 10 40 Z" fill="#AA151B" stroke="#AA151B" stroke-width="2"/>
    <circle cx="45" cy="12" r="5" fill="#F1BF00"/>
    <circle cx="15" cy="12" r="4" fill="#F1BF00"/>
    <circle cx="75" cy="12" r="4" fill="#F1BF00"/>
    <!-- Shield -->
    <path d="M 12 45 L 78 45 L 78 95 C 78 125, 45 140, 45 140 C 45 140, 12 125, 12 95 Z" fill="#AA151B" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Inner Quarters -->
    <path d="M 15 48 L 45 48 L 45 90 L 15 90 Z" fill="#AA151B"/>
    <path d="M 45 48 L 75 48 L 75 90 L 45 90 Z" fill="#FFFFFF"/>
    <path d="M 15 90 L 45 90 L 45 125 C 30 118, 18 106, 15 90 Z" fill="#F1BF00"/>
    <path d="M 45 90 L 75 90 C 72 106, 60 118, 45 125 Z" fill="#AA151B"/>
    <circle cx="45" cy="90" r="7" fill="#002654" stroke="#AA151B" stroke-width="1.5"/>
    <!-- Left Pillar -->
    <rect x="-8" y="45" width="8" height="90" rx="3" fill="#FFFFFF" stroke="#AA151B" stroke-width="1"/>
    <!-- Right Pillar -->
    <rect x="90" y="45" width="8" height="90" rx="3" fill="#FFFFFF" stroke="#AA151B" stroke-width="1"/>
  </g>
</svg>
